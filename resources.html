<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>接案流程資源對照表</title>
  <link rel="stylesheet" href="assets/style-fonts.css">
  <link rel="stylesheet" href="assets/style-base.css">
  <link rel="stylesheet" href="assets/style-resources.css">
</head>
<body>
  <!-- Search overlay -->
  <div id="search-overlay" class="search-overlay hidden">
    <div class="search-box">
      <input id="search-input" type="text" placeholder="搜尋資源..." autocomplete="off">
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <div class="app-layout">
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo">資源對照</span>
        <div style="display:flex;gap:4px;align-items:center;">
          <button id="theme-toggle" class="theme-toggle" aria-label="切換為深色主題">Dark</button>
          <button id="search-btn" class="search-trigger" title="Ctrl+K" aria-label="搜尋">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.35-4.35"/>
            </svg>
          </button>
          <a href="dashboard.html" class="back-link" title="返回 Dashboard" aria-label="返回 Dashboard">←</a>
        </div>
      </div>
      <ul class="nav-list governance-nav">
        <li class="nav-item">
          <a href="governance.html" class="governance-link" aria-label="治理原則">⚠ 治理原則</a>
        </li>
      </ul>
      <ul class="nav-list" id="nav-list">
        <!-- JS 動態填入 -->
      </ul>
    </nav>

    <main id="main-content" class="main-content">
      <aside class="tier4-banner" role="alert">
        <strong>⚠ AI 禁止執行的 7 項決策（Tier 4 Human-only）：</strong>
        <span class="tier4-item">報價拍板</span>
        <span class="tier4-item">合約簽署</span>
        <span class="tier4-item">SOW 範疇確認</span>
        <span class="tier4-item">CR 批准</span>
        <span class="tier4-item">UAT 驗收判定</span>
        <span class="tier4-item">Production 部署</span>
        <span class="tier4-item">Hotfix 執行</span>
      </aside>
      <div id="catalog-content" class="content-wrapper"></div>
      <div id="catalog-error" class="catalog-error hidden" role="alert">
        <p>無法載入 <code>resources-catalog.md</code>。可能原因：</p>
        <ul>
          <li>GitHub Pages 快取尚未更新（等待 1-2 分鐘後重新整理）</li>
          <li>瀏覽器阻擋 fetch（確認非 file:// 協定）</li>
          <li>本機開發：需用 HTTP server，不能直接雙擊 HTML</li>
        </ul>
        <pre>python -m http.server 8080</pre>
      </div>
    </main>
  </div>

  <noscript><div class="noscript-banner">JS 已停用。請直接閱讀 <a href="resources-catalog.md">resources-catalog.md</a> 原始檔。</div></noscript>
  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/resources-loader.js"></script>
  <script>
    (function() {
      var saved = localStorage.getItem('cowork-theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      var btn = document.getElementById('theme-toggle');
      btn.textContent = saved === 'dark' ? 'Light' : 'Dark';
      btn.setAttribute('aria-label', saved === 'dark' ? '切換為淺色主題' : '切換為深色主題');
    })();

    document.getElementById('theme-toggle').addEventListener('click', function() {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('cowork-theme', next);
      this.textContent = next === 'dark' ? 'Light' : 'Dark';
      this.setAttribute('aria-label', next === 'dark' ? '切換為淺色主題' : '切換為深色主題');
    });
    window.addEventListener('storage', function(e) {
      if (e.key === 'cowork-theme' && e.newValue) {
        document.documentElement.setAttribute('data-theme', e.newValue);
        var btn = document.getElementById('theme-toggle');
        if (btn) {
          btn.textContent = e.newValue === 'dark' ? 'Light' : 'Dark';
          btn.setAttribute('aria-label', e.newValue === 'dark' ? '切換為淺色主題' : '切換為深色主題');
        }
      }
    });

    ResourcesLoader.init();
  </script>
</body>
</html>
