<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 接案交付治理手冊</title>
  <link rel="stylesheet" href="assets/style-fonts.css">
  <link rel="stylesheet" href="assets/style-base.css">
  <link rel="stylesheet" href="assets/style-resources.css">
</head>
<body>
  <div class="app-layout">
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo">治理手冊</span>
        <div style="display:flex;gap:4px;align-items:center;">
          <button id="theme-toggle" class="theme-toggle" aria-label="切換為深色主題">Dark</button>
          <a href="resources.html" class="back-link" title="返回資源庫" aria-label="返回資源庫">← 資源庫</a>
        </div>
      </div>
      <ul class="nav-list" id="nav-list">
        <li class="nav-item"><a href="#hard-rules">10 條硬規則</a></li>
        <li class="nav-item"><a href="#tier4-reference">Tier 4 對照表</a></li>
        <li class="nav-item"><a href="#status-promotion">Status 升等</a></li>
        <li class="nav-item"><a href="#responsibility">責任歸屬</a></li>
        <li class="nav-item"><a href="#violation-handling">違規處理</a></li>
        <li class="nav-item"><a href="#audit-log">稽核紀錄</a></li>
      </ul>
    </nav>

    <main id="main-content" class="main-content">
      <div id="catalog-content" class="content-wrapper"></div>
      <div id="catalog-error" class="catalog-error hidden" role="alert">
        <p>無法載入 <code>governance.md</code>。可能原因：</p>
        <ul>
          <li>GitHub Pages 快取尚未更新（等待 1-2 分鐘後重新整理）</li>
          <li>瀏覽器阻擋 fetch（確認非 file:// 協定）</li>
          <li>本機開發：需用 HTTP server，不能直接雙擊 HTML</li>
        </ul>
        <pre>python -m http.server 8080</pre>
      </div>
    </main>
  </div>

  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/governance-loader.js"></script>
  <script>
    (function() {
      var saved = localStorage.getItem('cowork-theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      var btn = document.getElementById('theme-toggle');
      btn.textContent = saved === 'dark' ? 'Light' : 'Dark';
      btn.setAttribute('aria-label', saved === 'dark' ? '切換為淺色主題' : '切換為深色主題');
    })();

    document.getElementById('theme-toggle').addEventListener('click', function() {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('cowork-theme', next);
      this.textContent = next === 'dark' ? 'Light' : 'Dark';
      this.setAttribute('aria-label', next === 'dark' ? '切換為淺色主題' : '切換為深色主題');
    });
    window.addEventListener('storage', function(e) {
      if (e.key === 'cowork-theme' && e.newValue) {
        document.documentElement.setAttribute('data-theme', e.newValue);
        var btn = document.getElementById('theme-toggle');
        if (btn) {
          btn.textContent = e.newValue === 'dark' ? 'Light' : 'Dark';
          btn.setAttribute('aria-label', e.newValue === 'dark' ? '切換為淺色主題' : '切換為深色主題');
        }
      }
    });

    GovernanceLoader.init();
  </script>
</body>
</html>
