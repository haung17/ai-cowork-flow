<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM/QA/工程師 AI Cowork 流程指南</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style-base.css">
  <link rel="stylesheet" href="assets/style-dash.css">
</head>
<body>
  <!-- 搜尋面板 -->
  <div id="search-overlay" class="search-overlay hidden">
    <div class="search-box">
      <input id="search-input" type="text" placeholder="搜尋章節、關鍵字..." autocomplete="off">
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <!-- 主佈局 -->
  <div class="app-layout">
    <!-- 左側 Sidebar -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo">AI Cowork</span>
        <div style="display:flex;gap:4px;align-items:center;">
          <button id="theme-toggle" class="theme-toggle">Dark</button>
          <button id="search-btn" class="search-trigger" title="Ctrl+K">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </button>
        </div>
      </div>
      <ul class="nav-list" id="nav-list">
        <!-- JS 動態填入 -->
      </ul>
    </nav>

    <!-- 主內容 -->
    <main id="main-content" class="main-content">
      <div class="content-wrapper">
        <!-- JS 動態填入章節 -->
      </div>
    </main>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/interactions.js"></script>
  <script>
    (function() {
      const saved = localStorage.getItem('cowork-theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      document.getElementById('theme-toggle').textContent = saved === 'dark' ? 'Light' : 'Dark';
    })();
    DashboardInteractions.init();
    document.getElementById('theme-toggle').addEventListener('click', function() {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('cowork-theme', next);
      this.textContent = next === 'dark' ? 'Light' : 'Dark';
    });
  </script>
</body>
</html>
